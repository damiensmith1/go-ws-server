name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi
      - run: go vet ./...
      # Build tags hide code from the default checks: `go build` skips
      # _test.go files entirely, and `go vet ./...` does not see anything
      # behind a tag. Without this, a signature change that breaks
      # integration_test.go is only caught by the Docker job minutes
      # later. Compiling the tagged test binary needs no Docker.
      - run: go vet -tags=integration ./...
      - run: go test -tags=integration -c -o /dev/null .
      - run: go build ./...
      - run: go test -race -timeout 90s ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      # GitHub-hosted runners ship Docker; testcontainers picks it up.
      - run: go test -tags=integration -timeout=180s -v .
